name: CI

on:
  pull_request:
  push:
    branches: [test, main]

permissions:
  contents: read

concurrency:
  group: kickhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
      - run: supabase db start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check supabase/functions/secure-rpc/index.ts

  deploy-supabase-staging:
    name: Deploy Supabase staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    needs: [frontend, database, edge-function]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: supabase-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
      - name: Check staging configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" && -n "$SUPABASE_PROJECT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase staging was not deployed because the staging environment secrets are not configured yet."
          fi
      - name: Link staging project
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply staging migrations
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase db push --dry-run --include-all
          supabase db push --include-all
      - name: Deploy staging Edge Functions
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy secure-rpc --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

  deploy-supabase-production:
    name: Deploy Supabase production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, database, edge-function]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
      - name: Check production configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" && -n "$SUPABASE_PROJECT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase production was not deployed because the production environment secrets are not configured yet."
          fi
      - name: Link production project
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply production migrations
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase db push --dry-run --include-all
          supabase db push --include-all
      - name: Deploy production Edge Functions
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy secure-rpc --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
