<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>KickHub</title>
  <!--
    A mesma geometria do BrandMark, aqui em ficheiro porque o browser pede o
    favicon antes de existir React nenhum. Se um dia o símbolo mudar, mudam os
    dois — e é por isso que ambos vivem com as mesmas coordenadas à vista.

    Fundo escuro sempre: o lima da marca é ilegível sobre o branco do separador.
  -->
  <rect width="32" height="32" rx="9" fill="#0a1710"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#d8ff45" stroke-width="2.6"
          stroke-linecap="round" stroke-dasharray="52 17" stroke-dashoffset="-9"/>
  <path d="M11.6 8.6v14.8M21.4 8.6 13.6 16l7.8 7.4" fill="none" stroke="#d8ff45"
        stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
